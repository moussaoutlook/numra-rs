[package]
name = "numra"
description = "Numra: a composable Rust workspace for scientific computing — differential equations (ODE/SDE/DDE/FDE/IDE/PDE/SPDE), optimization, automatic differentiation, linear algebra, statistics, signal processing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords = ["numerical", "scientific", "differential-eqns", "optimization", "mathematics"]
categories = ["mathematics", "science", "algorithms", "simulation"]
readme = "README.md"

[dependencies]
numra-core = { workspace = true }
numra-linalg = { workspace = true }
numra-nonlinear = { workspace = true }
numra-ode = { workspace = true }
numra-sde = { workspace = true }
numra-dde = { workspace = true }
numra-fde = { workspace = true }
numra-ide = { workspace = true }
numra-pde = { workspace = true }
numra-spde = { workspace = true }
numra-autodiff = { workspace = true }
numra-optim = { workspace = true }
numra-ocp = { workspace = true }
numra-integrate = { workspace = true }
numra-interp = { workspace = true }
numra-special = { workspace = true }
numra-fft = { workspace = true }
numra-stats = { workspace = true }
numra-fit = { workspace = true }
numra-signal = { workspace = true }

