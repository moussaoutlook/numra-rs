# Nextest configuration.
#
# `slow-timeout` is the primary defense against the "one hanging test
# burns the whole 30-minute job budget" failure mode that cancelled
# CI #44 on commit 07c7c63. A test is flagged as slow when it exceeds
# `period`; after `terminate-after` consecutive slow periods (so
# 3 × 60 s = 3 min wall-clock total) nextest kills the test process
# and the run continues. The remaining suites still finish so a
# single hang no longer hides whatever else might be failing.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Per-test overrides for legitimately long-running tests. The 3-min
# ceiling above is for the "something is wrong" case; these tests are
# expected to be slow and run within the wider budget. Keep this list
# small — if it grows, optimise the tests instead.
#
# * mol3d_parametric: 3D heat-equation MOL with Radau5 + forward
#   sensitivity. 729 interior points × 2 (state + sensitivity) → dense
#   Jacobian factorisations dominate. ~130 s on M4 Max, ~3 min on
#   GitHub-hosted Linux runners.
[[profile.default.overrides]]
filter = 'package(numra-pde) and test(test_forward_sensitivity_matches_analytical_decay)'
slow-timeout = { period = "60s", terminate-after = 10 }
