# Numra website CI/CD — GitHub Actions
# ----------------------------------------------------------------------
# Builds and deploys both the marketing site (numra-rs.org) and the
# book (book.numra-rs.org) to Cloudflare Pages, plus runs Lighthouse
# CI and pa11y on each PR.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — Pages:Edit + Account:Read scope
#   CLOUDFLARE_ACCOUNT_ID  — from Cloudflare dashboard
#
# Optional:
#   LHCI_GITHUB_APP_TOKEN  — for Lighthouse status checks on PRs
#                            (install the Lighthouse CI GitHub App
#                            at https://github.com/apps/lighthouse-ci
#                            then add the token here)
#
# Cloudflare Pages projects expected:
#   numra-site-2     →  numra-rs.org
#   numra-book-2     →  book.numra-rs.org
#   numra-examples-2 →  examples.numra-rs.org
#
# This workflow lives at .github/workflows/website.yml in the repo root.

name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

# Cancel in-flight runs of the same workflow on the same ref.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write  # for Lighthouse CI to comment on PRs

jobs:
  # ----------------------------------------------------------------- site
  site:
    name: Build & deploy marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      preview_url: ${{ steps.deploy_site.outputs.deployment-url }}
      preview_alias: ${{ steps.deploy_site.outputs.pages-deployment-alias-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Lighthouse CI needs git history for ancestor comparison
          fetch-depth: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/site/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website/site
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: website/site
        run: pnpm astro check

      - name: Build
        working-directory: website/site
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        id: deploy_site
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/site/dist --project-name=numra-site-2 --branch=${{ github.head_ref || github.ref_name }}

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: website/site/dist
          retention-days: 7

  # ------------------------------------------------------------------ book
  book:
    name: Build & deploy book
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      preview_url: ${{ steps.deploy_book.outputs.deployment-url }}
      preview_alias: ${{ steps.deploy_book.outputs.pages-deployment-alias-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/book/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/book/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website/book
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: website/book
        run: pnpm astro check

      - name: Build (Starlight + Pagefind)
        working-directory: website/book
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        id: deploy_book
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/book/dist --project-name=numra-book-2 --branch=${{ github.head_ref || github.ref_name }}

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: book-dist
          path: website/book/dist
          retention-days: 7

  # -------------------------------------------------------------- examples
  examples:
    name: Build & deploy examples gallery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      preview_url: ${{ steps.deploy_examples.outputs.deployment-url }}
      preview_alias: ${{ steps.deploy_examples.outputs.pages-deployment-alias-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/examples/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/examples/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website/examples
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: website/examples
        run: pnpm astro check

      - name: Build
        working-directory: website/examples
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        id: deploy_examples
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/examples/dist --project-name=numra-examples-2 --branch=${{ github.head_ref || github.ref_name }}

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: examples-dist
          path: website/examples/dist
          retention-days: 7

  # ----------------------------------------------------------- lighthouse
  # On PRs, audit the per-deployment preview URLs (so the score reflects
  # the diff under review). On push-to-main, fall back to the production
  # apex URLs so post-merge regressions still page someone.
  lighthouse-site:
    name: Lighthouse (marketing site)
    needs: [site]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve site preview URL
        id: resolve_site_url
        run: |
          base="${{ needs.site.outputs.preview_alias }}"
          if [ -z "$base" ]; then base="${{ needs.site.outputs.preview_url }}"; fi
          if [ -z "$base" ]; then
            echo "::error::No preview URL captured from wrangler-action"
            exit 1
          fi
          base="${base%/}"
          {
            echo "urls<<EOF"
            for path in / /install /license /commercial /cite /community /stability /features /privacy; do
              echo "$base$path"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Lighthouse — preview URLs
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.resolve_site_url.outputs.urls }}
          configPath: ./website/ci/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  lighthouse-book:
    name: Lighthouse (book)
    needs: [book]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve book preview URL
        id: resolve_book_url
        run: |
          base="${{ needs.book.outputs.preview_alias }}"
          if [ -z "$base" ]; then base="${{ needs.book.outputs.preview_url }}"; fi
          if [ -z "$base" ]; then
            echo "::error::No book preview URL captured from wrangler-action"
            exit 1
          fi
          base="${base%/}"
          {
            echo "urls<<EOF"
            for path in / /ch01-fundamentals/numerical-stability/ /ch02-solving-odes/your-first-ode/ /ch13-performance/ /ch13-performance/comparisons/; do
              echo "$base$path"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Lighthouse — book preview URLs
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.resolve_book_url.outputs.urls }}
          configPath: ./website/ci/lighthouserc-book.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # ----------------------------------------------------------------- a11y
  pa11y:
    name: Accessibility (pa11y-ci)
    needs: [site, book, examples]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci@4

      - name: Generate per-PR pa11y config
        id: gen_pa11y
        run: |
          site_base="${{ needs.site.outputs.preview_alias }}"
          if [ -z "$site_base" ]; then site_base="${{ needs.site.outputs.preview_url }}"; fi
          book_base="${{ needs.book.outputs.preview_alias }}"
          if [ -z "$book_base" ]; then book_base="${{ needs.book.outputs.preview_url }}"; fi
          examples_base="${{ needs.examples.outputs.preview_alias }}"
          if [ -z "$examples_base" ]; then examples_base="${{ needs.examples.outputs.preview_url }}"; fi
          for var in site_base book_base examples_base; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing preview URL: $var"
              exit 1
            fi
          done
          site_base="${site_base%/}"
          book_base="${book_base%/}"
          examples_base="${examples_base%/}"
          out=website/ci/pa11yci-pr.json
          jq \
            --arg site "$site_base" \
            --arg book "$book_base" \
            --arg examples "$examples_base" \
            '.urls = [
              ($site + "/"),
              ($site + "/install"),
              ($site + "/license"),
              ($site + "/cite"),
              ($site + "/community"),
              ($book + "/"),
              ($examples + "/")
            ]' \
            website/ci/pa11yci.json > "$out"
          cat "$out"
          echo "config=$out" >> "$GITHUB_OUTPUT"

      - name: Run pa11y-ci against preview URLs
        run: pa11y-ci --config "${{ steps.gen_pa11y.outputs.config }}"

  # ---------------------------------------------------------- playwright
  # Dark-mode FOIT regression suite. Audits the per-PR preview URLs so
  # the assertions reflect the diff under review. The suite is intentionally
  # narrow today (theme paint at domcontentloaded) — it's the safety net
  # for the kinds of bugs we hit during the Starlight upgrade in early 2026.
  playwright:
    name: Playwright (dark-mode regression)
    needs: [site, book]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/tests/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/tests/pnpm-lock.yaml

      - name: Install Playwright deps
        working-directory: website/tests
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: website/tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve preview URLs
        id: urls
        run: |
          site_url="${{ needs.site.outputs.preview_alias }}"
          if [ -z "$site_url" ]; then site_url="${{ needs.site.outputs.preview_url }}"; fi
          book_url="${{ needs.book.outputs.preview_alias }}"
          if [ -z "$book_url" ]; then book_url="${{ needs.book.outputs.preview_url }}"; fi
          if [ -z "$site_url" ] || [ -z "$book_url" ]; then
            echo "::error::Missing site/book preview URL — wrangler-action did not emit one."
            exit 1
          fi
          echo "site=${site_url%/}" >> "$GITHUB_OUTPUT"
          echo "book=${book_url%/}" >> "$GITHUB_OUTPUT"

      - name: Run Playwright
        working-directory: website/tests
        env:
          NUMRA_SITE_URL: ${{ steps.urls.outputs.site }}
          NUMRA_BOOK_URL: ${{ steps.urls.outputs.book }}
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: website/tests/playwright-report
          retention-days: 7
