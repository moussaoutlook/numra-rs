name: Slow tests

# Exercises `#[ignore]`d tests that are too heavy for the main CI lane —
# notably the 3D PDE forward-sensitivity decay test, which factorises a
# dense Jacobian on the augmented system and takes >10 min on 2-vCPU
# GitHub-hosted runners. Runs weekly and on demand; not on every push.

on:
  schedule:
    # Sundays at 06:00 UTC.
    - cron: '0 6 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run ignored tests under slow profile
        run: cargo nextest run --workspace --profile slow --run-ignored=ignored-only
