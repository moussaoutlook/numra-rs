[package]
name = "numra-optim"
description = "Optimization for Numra: BFGS, L-BFGS, L-BFGS-B, Levenberg-Marquardt, Nelder-Mead, CMA-ES, SQP, LP/MILP, augmented Lagrangian, NSGA-II."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords = ["optimization", "bfgs", "levenberg-marquardt", "nelder-mead", "milp"]
categories = ["mathematics", "science", "algorithms"]
readme = "README.md"

[dependencies]
numra-core = { workspace = true }
numra-linalg = { workspace = true }
numra-nonlinear = { workspace = true }
numra-autodiff = { workspace = true }
faer = { workspace = true }
thiserror = { workspace = true }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
